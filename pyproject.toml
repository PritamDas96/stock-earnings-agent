[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-earnings-agent"
version = "1.0.0"
description = "An earnings-analysis agent combining financial data, RAG over filings, LLM reasoning and an MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Stock Earnings Agent" }]
dependencies = [
    "mcp[cli]>=1.0.0",
    "fastmcp>=0.9.0",
    "yfinance>=0.2.40",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pdfplumber>=0.11.0",
    "chromadb>=0.5.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    "groq>=0.9.0",
    "streamlit>=1.40.0",
    "ragas>=0.2.0",
    "datasets>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
]

[project.scripts]
earnings-mcp = "mcp_server.server:main"
earnings-ingest = "scripts.ingest:main"
earnings-healthcheck = "scripts.healthcheck:main"

[tool.setuptools]
packages = ["core", "rag_pipeline", "agents", "mcp_server", "mcp_server.tools", "app", "evaluation", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests exercise ChromaDB's native core and must run in a dedicated
# process on Windows (see `make test-integration`); exclude them by default.
addopts = "-ra -q -m 'not integration' -p no:cacheprovider"
markers = [
    "integration: tests that exercise the ChromaDB native core (run separately).",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Documentation rendering scripts embed HTML/CSS as string literals, where
# wrapping to the line limit would harm readability.
"scripts/render_diagrams.py" = ["E501"]
"scripts/render_terminal.py" = ["E501"]
